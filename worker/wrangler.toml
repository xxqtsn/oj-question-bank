name = "oj-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "oj-db"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# 环境变量（Resend API Key 部署时通过 wrangler secret put 设置）
[vars]
FRONTEND_URL = "https://justpassingby.us.ci"
SITE_OWNER_EMAIL = "admin@oj.com"
